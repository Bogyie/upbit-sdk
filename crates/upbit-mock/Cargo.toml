[package]
name = "upbit-mock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mock server test tooling foundation for the Upbit SDK workspace."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
